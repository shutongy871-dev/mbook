name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

      - name: Enforce 10 MB production size limit
        shell: bash
        run: |
          size_kb="$(du -sk .output/chrome-mv3 | cut -f1)"
          echo "Production extension size: ${size_kb} KB"
          test "${size_kb}" -le 10240
